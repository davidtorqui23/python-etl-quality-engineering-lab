name: Story-Specific Validation

on:
  workflow_dispatch:
    inputs:
      test_path:
        description: 'Path to the pytest target, for example tests/test_validate_email_quality.py'
        required: true
        default: tests/test_validate_email_quality.py

jobs:
  story-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run selected story tests
        run: python -m pytest -q ${{ github.event.inputs.test_path }}

      - name: Upload story test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-pytest-report
          path: reports/pytest/pytest-report.xml
